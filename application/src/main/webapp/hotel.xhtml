<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    template="/WEB-INF/template.xhtml">
    <f:metadata>
        <f:viewParam name="hotid" value="#{hotelBooking.hotelId}" converter="jakarta.faces.Long" />
        <f:viewAction action="#{hotelBooking.selectHotel}" />
    </f:metadata>
    <ui:define name="content">
        <div class="section">
            <h1>View Hotel</h1>
        </div>
        <div class="section">
            <div class="entry">
                <div class="label">Name:</div>
                <div class="output">#{hotelBooking.hotel.name}</div>
            </div>
            <div class="entry">
                <div class="label">Address:</div>
                <div class="output">#{hotelBooking.hotel.address}</div>
            </div>
            <div class="entry">
                <div class="label">City:</div>
                <div class="output">#{hotelBooking.hotel.city}</div>
            </div>
            <div class="entry">
                <div class="label">State:</div>
                <div class="output">#{hotelBooking.hotel.state}</div>
            </div>
            <div class="entry">
                <div class="label">Zip:</div>
                <div class="output">#{hotelBooking.hotel.zip}</div>
            </div>
            <div class="entry">
                <div class="label">Country:</div>
                <div class="output">#{hotelBooking.hotel.country}</div>
            </div>
            <div class="entry">
                <div class="label">Nightly rate:</div>
                <div class="output">
                    <h:outputText id="HotelPrice" value="#{hotelBooking.hotel.price}">
                        <f:convertNumber type="currency" currencySymbol="$" />
                    </h:outputText>
                </div>
            </div>
            <div class="entry errors">
                <h:messages id="messages" redisplay="false" />
            </div>
        </div>
        <div class="section">
            <h:form id="hotel">
                <fieldset class="buttonBox">
                    <h:commandButton id="bookHotel" action="#{hotelBooking.bookHotel}" value="Book Hotel" />&#160;
                    <h:commandButton id="cancel" action="#{hotelBooking.cancel}" value="Back to Search" />
                </fieldset>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
