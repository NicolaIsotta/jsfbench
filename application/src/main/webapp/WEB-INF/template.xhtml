<!DOCTYPE html>
<html xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>JBoss Suites: Seam Framework</title>
        <h:outputStylesheet name="css/screen.css"/>
    </h:head>
    <h:body>
        <div id="document">
            <div id="header">
                <div id="title"><h:graphicImage name="img/hdr.title.gif" alt="JBoss Suites: seam framework demo"/></div>
                <div id="status">
                    Welcome #{bookingSession.user.name}
                    | <h:link id="search" outcome="main" value="Search"/>
                    | <h:link id="settings" outcome="password" value="Settings"/>
                    | <h:form id="logoutForm"><h:commandLink id="logout" action="#{bookingSession.logout()}" value="Logout"/></h:form>
                </div>
            </div>
            <div id="container">
                <div id="sidebar"></div>
                <div id="content">
                    <ui:insert name="content"/>
                </div>
            </div>
            <div id="footer">Created with JBoss Seam 2.0, JSF 1.2, Hibernate 3 and Facelets</div>
        </div>
    </h:body>
</html>
