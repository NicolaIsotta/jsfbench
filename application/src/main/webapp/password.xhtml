<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="section">
            <h1>Change Your Password</h1>
        </div>
        <div class="section">
            <h:form id="setpassword">
                <fieldset>
                    <div class="entry">
                        <div class="label">
                            <h:outputLabel id="PasswordLabel" for="password">Password:</h:outputLabel>
                        </div>
                        <div class="input">
                            <h:panelGroup id="PasswordDecorate">
                                <h:inputSecret id="password" value="#{changePassword.user.password}" required="true">
                                    <f:validateBean />
                                </h:inputSecret>
                                <div>
                                    <h:message for="password" errorClass="errors" />
                                </div>
                            </h:panelGroup>
                        </div>
                    </div>
                    <div class="entry">
                        <div class="label">
                            <h:outputLabel id="VerifyLabel" for="verify">Verify:</h:outputLabel>
                        </div>
                        <div class="input">
                            <h:panelGroup id="VerifyDecorate">
                                <h:inputSecret id="verify" value="#{changePassword.verify}" required="true" />
                                <div>
                                    <h:message for="verify" errorClass="errors" />
                                </div>
                            </h:panelGroup>
                        </div>
                    </div>
                    <div class="entry errors">
                        <h:messages id="messages" redisplay="false" />
                    </div>
                    <div class="entry">
                        <div class="label"></div>
                        <div class="input">
                            <h:commandButton id="change" value="Change" action="#{changePassword.changePassword}" />
                            &#160;
                            <h:button id="cancel" value="Cancel" outcome="main" />
                        </div>
                    </div>
                </fieldset>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
