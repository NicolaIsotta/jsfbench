<!DOCTYPE html>
<html xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core">
<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>JBoss Suites: JSF 2 Framework</title>
    <h:outputStylesheet name="css/screen.css" />
</h:head>
<h:body id="pgHome">
    <div id="document">
        <div id="header">
            <div id="title">
                <h:graphicImage name="img/hdr.title.gif" alt="JBoss Suites: JSF 2 framework demo" />
            </div>
        </div>
        <div id="container">
            <div id="sidebar">
                <h:form id="login">
                    <fieldset>
                        <div>
                            <h:outputLabel id="UsernameLabel" for="username">Login Name</h:outputLabel>
                            <h:inputText id="username" value="#{authenticator.username}" style="width: 175px;">
                                <f:validateBean disabled="true" />
                            </h:inputText>
                            <div class="errors">
                                <h:message id="message" for="username" />
                            </div>
                        </div>
                        <div>
                            <h:outputLabel id="PasswordLabel" for="password">Password</h:outputLabel>
                            <h:inputSecret id="password" value="#{authenticator.password}" style="width: 175px;">
                                <f:validateBean disabled="true" />
                            </h:inputSecret>
                            <div class="errors">
                                <h:message id="passwordMessage" for="password" />
                            </div>
                        </div>
                        <div class="errors">
                            <h:messages id="messages" redisplay="false" />
                        </div>
                        <div class="buttonBox">
                            <h:commandButton id="login" action="#{authenticator.authenticate}" value="Account Login" />
                        </div>
                        <div class="notes">
                            <h:link id="register" outcome="register" value="Register New User" />
                        </div>
                        <div class="subnotes">
                            Or use a demo account:
                            <ul>
                                <li>gavin/foobar</li>
                                <li>demo/demo</li>
                            </ul>
                        </div>
                    </fieldset>
                </h:form>
            </div>
        </div>
        <div id="footer">Created with JBoss EJB 3.0, Seam, JSF (Mojarra), and Facelets</div>
    </div>
</h:body>

</html>
