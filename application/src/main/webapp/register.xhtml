<!DOCTYPE html>
<html xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core">
<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>JBoss Suites: Seam Framework</title>
    <h:outputStylesheet name="css/screen.css" />
</h:head>
<h:body id="pgHome">
    <div id="document">
        <div id="header">
            <div id="title">
                <h:graphicImage name="img/hdr.title.gif" alt="JBoss Suites: seam framework demo" />
            </div>
        </div>
        <div id="container">
            <div id="sidebar">
            </div>
            <div id="content">
                <div class="section">
                    <h1>Register</h1>
                </div>
                <div class="section">
                    <h:form id="register">
                        <f:validateBean>
                            <fieldset>
                                <div class="entry">
                                    <div class="label">
                                        <h:outputLabel id="UsernameLabel" for="username">Username:</h:outputLabel>
                                    </div>
                                    <div class="input">
                                        <h:panelGroup id="usernameDecorate">
                                            <h:inputText id="username" value="#{register.user.username}"
                                                required="true">
                                                <f:ajax event="blur" render="usernameDecorate" />
                                            </h:inputText>
                                            <div>
                                                <h:message for="username" errorClass="errors" />
                                            </div>
                                        </h:panelGroup>
                                    </div>
                                </div>
                                <div class="entry">
                                    <div class="label">
                                        <h:outputLabel id="RealNameLabel" for="name">Real Name:</h:outputLabel>
                                    </div>
                                    <div class="input">
                                        <h:panelGroup id="nameDecorate">
                                            <h:inputText id="name" value="#{register.user.name}" required="true">
                                                <f:ajax event="blur" render="nameDecorate" />
                                            </h:inputText>
                                            <div>
                                                <h:message for="name" errorClass="errors" />
                                            </div>
                                        </h:panelGroup>
                                    </div>
                                </div>
                                <div class="entry">
                                    <div class="label">
                                        <h:outputLabel id="PasswordLabel" for="password">Password:</h:outputLabel>
                                    </div>
                                    <div class="input">
                                        <h:panelGroup id="passwordDecorate">
                                            <h:inputSecret id="password" value="#{register.user.password}"
                                                required="true" />
                                            <div>
                                                <h:message for="password" errorClass="errors" />
                                            </div>
                                        </h:panelGroup>
                                    </div>
                                </div>
                                <div class="entry">
                                    <div class="label">
                                        <h:outputLabel for="verify">Verify Password:</h:outputLabel>
                                    </div>
                                    <div class="input">
                                        <h:panelGroup id="verifyDecorate">
                                            <h:inputSecret id="verify" value="#{register.verify}" required="true" />
                                            <div>
                                                <h:message for="verify" errorClass="errors" />
                                            </div>
                                        </h:panelGroup>
                                    </div>
                                </div>
                                <div class="entry errors">
                                    <h:messages id="messages" redisplay="false" />
                                </div>
                                <div class="entry">
                                    <div class="label"></div>
                                    <div class="input">
                                        <h:commandButton id="register" value="Register" action="#{register.register}" />
                                        &#160;
                                        <h:button id="cancel" value="Cancel" outcome="home" />
                                    </div>
                                </div>
                            </fieldset>
                        </f:validateBean>
                    </h:form>
                </div>
            </div>
        </div>
        <div id="footer">Created with JBoss EJB 3.0, Seam, JSF (Mojarra), and Facelets</div>
    </div>
</h:body>

</html>
